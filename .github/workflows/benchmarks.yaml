name: Go benchmark tracking

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two quick pushes must not race each other pushing to gh-pages.
concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run go benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: check out repo
        uses: actions/checkout@v4

      - name: check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: setup go env
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install deps
        run: go mod download

      - name: Run benchmarks
        id: bench
        run: |
          set -o pipefail
          go test ./... -bench=. -benchmem -count=6 -run='^$' -timeout=30m | tee output.txt \
            || echo "failed=true" >> "$GITHUB_OUTPUT"

      # Dashboard lives at https://<owner>.github.io/golphin/bench/
      - name: Record run
        run: |
          export COMMIT_MESSAGE="$(git log -1 --format=%B)"
          export COMMIT_AUTHOR="$(git log -1 --format=%an)"
          export COMMIT_TIMESTAMP="$(git log -1 --format=%cI)"
          mkdir -p pages/bench
          go run ./.github/bench/bench2json \
            -data pages/bench/data.json \
            -legacy pages/dev/bench/data.js \
            -module "$(go list -m)" \
            -repo "${{ github.server_url }}/${{ github.repository }}" \
            < output.txt > /dev/null

      - name: Publish dashboard
        run: |
          cp .github/bench/index.html pages/bench/index.html
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench
          git commit -m "bench: ${GITHUB_SHA::7}" || exit 0
          git push

      # Results are recorded first, so a broken package still shows up on the dashboard.
      - name: Fail if benchmarks failed
        if: steps.bench.outputs.failed == 'true'
        run: exit 1
